# 只放扩展需要的东西。
#
# 版本号**刻意与宿主 DSH-Folk/gradle/libs.versions.toml 保持一致**：
# 复合构建里 AGP/Kotlin/Compose 各有一份，但最终产物会被 d8 打进同一个 App 进程，
# 版本差太远很容易撞上 Kotlin metadata 版本或 Compose runtime 不兼容。
# 宿主升级时同步改这里（AGP、kotlin、compose-bom、material3 四处）。

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-bom = "2026.09.00"
material3 = "1.5.0-beta02"
coroutines = "1.11.0"

# SDK 版本。**必须与宿主一致**：扩展的 classes.dex 与宿主在同一进程里跑，
# 宿主是 minSdk 26 / compileSdk 37（见宿主 build.gradle.kts 的 extra 声明）。
#
# 这里显式写数字，不从宿主读：rootProject.extra 在复合构建里指的是**本仓库**的
# rootProject，不是宿主 —— 那边没有那两个 extra，取不到就抛
# 「Cannot get non-null extra property」。曾经那样写过，CI 报的正是这个错。
compileSdk = "37"
minSdk = "26"

[plugins]
agp-lib = { id = "com.android.library", version.ref = "agp" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
