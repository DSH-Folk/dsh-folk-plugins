# 扩展仓库自身的 Gradle 参数。只放**必须**的几项：宿主仓库的参数不该由这里决定。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
# 每个模块只生成自己的 R 类：扩展模块与宿主分属不同构建，同名资源不会互相覆盖
android.nonTransitiveRClass=true
kotlin.code.style=official

# 宿主当前用 compileSdk 37。万一本地 AGP 版本比 SDK 旧，这一行让它继续编译而不是直接失败；
# 宿主升 SDK 时这里也要跟着改（见 extensions/dsh-go-shell/build.gradle.kts 的 TODO）。
android.suppressUnsupportedCompileSdk=37
