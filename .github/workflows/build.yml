name: Build extensions

# push 到 main 或手动触发。
# 只改了 index.json / README 时不重编：回填提交由 GITHUB_TOKEN 推送，
# GitHub 本来就不会用它触发新的 run，这里再挡一层。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.json'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extensions:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个扩展失败不该带走另一个：产物互不相干，各自发布。
      fail-fast: false
      matrix:
        # 每加一个扩展：在 settings.gradle.kts 里 include、在 index.json 里登记、
        # 在这里加一行。三处都要，缺任何一处都会让"市场里有、但构建不出来"
        # 或者"构建出来了、但市场里没有"。
        id: [dsh-browser-bridge, dsh-minimal-shell]
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 复合构建（settings.gradle.kts 里的 includeBuild("../DSH-Folk")）要求宿主在同级目录。
      # 只读 clone，不往宿主仓库写任何东西。
      - name: 检出宿主 DSH-Folk
        run: |
          set -euo pipefail
          rm -rf ../DSH-Folk
          git clone --depth 1 https://github.com/DSH-Folk/DSH-Folk.git ../DSH-Folk
          echo "宿主 HEAD: $(git -C ../DSH-Folk rev-parse --short HEAD)"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # **不要**用 android-actions/setup-android@v3：2026-09 起它必定失败，与本仓库无关。
      # 它会因为「预装 sdkmanager 版本不是它期望的」而去安装独立的 tools 包，而 Google 已经把
      # tools 从 SDK 源里移除 —— sdkmanager 回 "Failed to find package 'tools'" 并以 1 退出。
      # （这条经验抄自宿主 DSH-Folk 的 .github/actions/setup-build-env，本仓库第一次跑
      #   就是挂在这一步，日志里正是 "Wrong version in preinstalled sdkmanager"。）
      #
      # 我们只需要两件事：许可证全部接受（AGP 才能自己按需下载 compileSdk / build-tools）
      # 与 platform-tools。直接调 sdkmanager，不挑版本、不装那个已不存在的包。
      - name: 安装 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK：$SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $SDK/cmdline-tools 下找不到 sdkmanager"
            exit 1
          fi
          echo "使用 $SDKMANAGER"
          "$SDKMANAGER" --version || true

          # 许可证缺一个，AGP 自动下载平台时就会失败，而报错只会说 platform not found
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" > /dev/null || true
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

      # compileSdk 的平台目录名不一定是 android-37：新 SDK 用小版本号（android-37.1），
      # 还有扩展级（android-34-ext10）。只按 android-37 去判会既看不到已有的 android-37.1、
      # 又去装一个根本不存在的包。装不上不算失败 —— 缺平台时 AGP 会自己下载（许可证已接受）。
      - name: 预装 compileSdk 平台（装不上就交给 AGP）
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # compileSdk 可能写成字面量，也可能走版本目录（libs.versions.compileSdk）。
          # 两种都要认：只认字面量时，扩展一旦改用版本目录这里就 grep 空、
          # 而 set -o pipefail 会让整条流水线以 1 退出 —— 报的错还完全看不出原因。
          PLATFORM=$(grep -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' "extensions/${{ matrix.id }}/build.gradle.kts" 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$PLATFORM" ]; then
            PLATFORM=$(grep -oE '^compileSdk[[:space:]]*=[[:space:]]*"[0-9]+"' gradle/libs.versions.toml 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)
          fi
          echo "compileSdk 期望: ${PLATFORM:-未知}"
          if ls "$SDK/platforms" 2>/dev/null | grep -qE "^android-${PLATFORM}(\.|$)"; then
            echo "已有 platforms;android-${PLATFORM}"
            exit 0
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -n "$SDKMANAGER" ] && [ -n "${PLATFORM:-}" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-$PLATFORM" > /dev/null \
              || echo "::warning::装 platforms;android-$PLATFORM 失败，交给 AGP 自己下载"
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      # 编译 + 打包一个扩展。用矩阵而不是复制 job：每加一个扩展只改上面那一行，
      # 而复制 job 会让"改了打包逻辑但只改了一个"这种漂移几乎必然发生。
      - name: 编译扩展（产出 AAR）
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace ":extensions:${{ matrix.id }}:assembleRelease"

      - name: 打包 .dshx（manifest.json + classes.dex）
        id: pack
        run: |
          set -euo pipefail

          MODULE="extensions/${{ matrix.id }}"
          # 名字与版本一律从 manifest 读：写死在这里就等于第二份事实，
          # 改了 manifest 却忘了改 workflow 会发出一个名字对不上的包。
          NAME=$(jq -r '.id // empty' "$MODULE/manifest.json")
          VERSION=$(jq -r '.version // empty' "$MODULE/manifest.json")
          if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::$MODULE/manifest.json 缺少 id 或 version"
            exit 1
          fi
          echo "扩展: $NAME v$VERSION"

          AAR=$(ls "$MODULE"/build/outputs/aar/*.aar 2>/dev/null | head -n 1 || true)
          if [ -z "$AAR" ]; then
            echo "::error::没找到 AAR，检查上面的编译日志"
            exit 1
          fi
          echo "AAR: $AAR"

          WORK=$(mktemp -d)
          unzip -o -q "$AAR" -d "$WORK/aar"
          JAR="$WORK/aar/classes.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::AAR 里没有 classes.jar"
            find "$WORK/aar" -maxdepth 2 -type f
            exit 1
          fi

          D8=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -n 1)
          if [ -z "$D8" ]; then
            echo "::error::$ANDROID_HOME/build-tools 下没有 d8"
            ls "$ANDROID_HOME" || true
            exit 1
          fi
          ANDROID_JAR="$ANDROID_HOME/platforms/android-37/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            ANDROID_JAR=$(ls "$ANDROID_HOME"/platforms/*/android.jar | sort -V | tail -n 1)
          fi
          echo "d8: $D8 / lib: $ANDROID_JAR"

          mkdir -p dist/dex
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output dist/dex "$JAR"
          cp "$MODULE/manifest.json" dist/manifest.json
          cp dist/dex/classes.dex dist/classes.dex

          # .dshx = 根目录只有 manifest.json + classes.dex 的 zip
          ( cd dist && zip -q -X "$NAME-$VERSION.dshx" manifest.json classes.dex )
          cp "dist/$NAME-$VERSION.dshx" "./$NAME-$VERSION.dshx"

          SHA=$(sha256sum "$NAME-$VERSION.dshx" | awk '{print $1}')
          SIZE=$(stat -c%s "$NAME-$VERSION.dshx")
          echo "sha256: $SHA ($SIZE bytes)"

          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "size=$SIZE"
            echo "file=$NAME-$VERSION.dshx"
          } >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ext-${{ steps.pack.outputs.name }}-v${{ steps.pack.outputs.version }}
          name: ${{ steps.pack.outputs.name }} v${{ steps.pack.outputs.version }}
          body: |
            扩展 `${{ steps.pack.outputs.name }}` v${{ steps.pack.outputs.version }}

            - 安装：DSH-Folk → 插件 → 扩展 → 扩展市场（或从链接/文件安装 .dshx）
            - 文件：`${{ steps.pack.outputs.file }}`（zip：manifest.json + classes.dex）
            - sha256：`${{ steps.pack.outputs.sha }}`

            扩展与宿主同权。任何时候在下面任一路径放一个 `.disable_extensions` 文件即可禁用全部三方扩展：
            私有目录 `files/extensions/`、`Android/data/me.bmax.apatch/files/`、`/sdcard/Download/DSH-Folk/`。
          files: ${{ steps.pack.outputs.file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 回填 index.json
        env:
          NAME: ${{ steps.pack.outputs.name }}
          VERSION: ${{ steps.pack.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha }}
          SIZE: ${{ steps.pack.outputs.size }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://github.com/$REPO/releases/download/ext-$NAME-v$VERSION/$NAME-$VERSION.dshx"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if ! jq -e --arg n "$NAME" '.extensions | map(.id) | index($n)' index.json > /dev/null; then
            echo "::error::index.json 里没有 $NAME 条目"
            exit 1
          fi

          jq --arg n "$NAME" --arg v "$VERSION" --arg sha "$SHA" --arg url "$URL" \
             --arg now "$NOW" --argjson size "$SIZE" '
            .generatedAt = $now
            | .extensions |= map(
                if .id == $n then
                  .version = $v | .sha256 = $sha | .downloadUrl = $url | .sizeBytes = $size
                else . end
              )
          ' index.json > index.json.tmp
          mv index.json.tmp index.json
          cat index.json

      - name: 提交 index.json 回 main
        run: |
          set -euo pipefail
          git config user.name "dsh-folk-ci"
          git config user.email "dsh-folk-ci@users.noreply.github.com"
          if git diff --quiet -- index.json; then
            echo "index.json 无变化，跳过提交"
            exit 0
          fi
          git add index.json
          git commit -m "chore(index): 回填 ${{ steps.pack.outputs.name }} v${{ steps.pack.outputs.version }} [skip ci]"
          git push